name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t giunti-app .
      - name: Smoke test
        run: |
          docker run -d --rm --name giunti-ci -p 127.0.0.1:18080:8000 giunti-app
          trap 'docker stop giunti-ci >/dev/null 2>&1 || true' EXIT
          test "$(docker exec giunti-ci id -u)" != 0
          docker exec giunti-ci sh -c 'test ! -e /app/backend/.env && test ! -e /app/.env'
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/api/health | grep '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/ | grep 'id="root"'
